name: Plan from GitHub Issue

on:
  workflow_call:
    inputs:
      issueNumber:
        type: string
        required: true
      issueTitle:
        type: string
        required: true
      issueBody:
        type: string
      issueAuthor:
        type: string
        required: true
      commentBody:
        type: string
      commentAuthor:
        type: string
      baseBranch:
        type: string
        default: main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      SF_AUTH_URL:
        required: true

env:
  NODE_VERSION: "24.16.0"
  SALESFORCE_CLI_VERSION: "2.140.6"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.baseBranch }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@${SALESFORCE_CLI_VERSION}
          node --version
          npm --version
          sf --version

      - name: Authenticate Salesforce org
        run: |
          trap 'rm -f /tmp/sf-auth.txt' EXIT
          echo "${{ secrets.SF_AUTH_URL }}" > /tmp/sf-auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sf-auth.txt --alias pipeline-org --set-default

      - name: Clone llm-sfdc-gh and install runner dependencies
        run: |
          gh repo clone 0cv/llm-sfdc-gh /tmp/llm-sfdc-gh -- --depth 1
          cd /tmp/llm-sfdc-gh && npm install
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Claude plan session
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issueNumber }}
          ISSUE_TITLE: ${{ inputs.issueTitle }}
          ISSUE_BODY: ${{ inputs.issueBody }}
          ISSUE_AUTHOR: ${{ inputs.issueAuthor }}
          COMMENT_BODY: ${{ inputs.commentBody }}
          COMMENT_AUTHOR: ${{ inputs.commentAuthor }}
          GH_TOKEN: ${{ github.token }}
          SF_TARGET_ORG: pipeline-org
        run: npx tsx /tmp/llm-sfdc-gh/src/runner/plan-from-issue.ts
