name: Iterate on PR Review

on:
  workflow_call:
    inputs:
      prNumber:
        type: string
        required: true
      prTitle:
        type: string
      commentBody:
        type: string
      commentAuthor:
        type: string
      prBranch:
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      SF_AUTH_URL:
        required: true
      BOT_GITHUB_TOKEN:
        required: false

env:
  NODE_VERSION: "24.16.0"
  SALESFORCE_CLI_VERSION: "2.140.6"

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.prBranch }}
          token: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm install -g @salesforce/cli@${SALESFORCE_CLI_VERSION}
          node --version
          npm --version
          sf --version

      - name: Authenticate Salesforce org
        run: |
          trap 'rm -f /tmp/sf-auth.txt' EXIT
          echo "${{ secrets.SF_AUTH_URL }}" > /tmp/sf-auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sf-auth.txt --alias pipeline-org --set-default

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone llm-sfdc-gh and install runner dependencies
        run: |
          gh repo clone 0cv/llm-sfdc-gh /tmp/llm-sfdc-gh -- --depth 1
          cd /tmp/llm-sfdc-gh && npm install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude iterate session
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ inputs.prNumber }}
          PR_TITLE: ${{ inputs.prTitle }}
          COMMENT_BODY: ${{ inputs.commentBody }}
          COMMENT_AUTHOR: ${{ inputs.commentAuthor }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_COMMENT_TOKEN: ${{ github.token }}
        run: npx tsx /tmp/llm-sfdc-gh/src/runner/iterate-from-review.ts
