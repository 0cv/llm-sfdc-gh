name: Close Awaiting Production Issues

on:
  workflow_call:
    inputs:
      productionBranch:
        type: string
        default: main
    secrets:
      BOT_GITHUB_TOKEN:
        required: false

env:
  NODE_VERSION: "24.18.1"

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clone llm-sfdc-gh and install runner dependencies
        run: |
          gh repo clone 0cv/llm-sfdc-gh /tmp/llm-sfdc-gh -- --depth 1
          cd /tmp/llm-sfdc-gh && npm install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close awaiting-production issues
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          PRODUCTION_BRANCH: ${{ inputs.productionBranch }}
        run: npx tsx /tmp/llm-sfdc-gh/src/runner/close-awaiting-production.ts
